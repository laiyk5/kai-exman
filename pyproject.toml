[project]
name = "kai-exman"
version = "0.1.0"
description = "A filesystem-based experiment management CLI for machine learning workflows, inspired by Git."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "LAI Yikai", email = "laiyk5@163.com"}]
keywords = ["experiment", "reproducibility", "ml", "cli", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.0", "rich>=13.0", "pyyaml>=6.0", "click>=8.0"]

[project.urls]
Homepage = "https://github.com/laiyk5/kai-exman"
Documentation = "https://kai-exman.readthedocs.io"
Repository = "https://github.com/laiyk5/kai-exman"
Issues = "https://github.com/laiyk5/kai-exman/issues"

[project.scripts]
kai-exman = "kaiexman.cli:main"

[project.optional-dependencies]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=3.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "interrogate>=1.5", "mypy>=1.5", "types-PyYAML>=6.0", "deptry>=0.25"]
dev = ["pre-commit>=3.0", "ruff>=0.15"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
per-file-ignores = { "tests/**" = ["E402"], "src/kaiexman/manager.py" = ["UP006", "UP035"] }

[tool.deptry]
ignore_notebooks = true
optional_dependencies_dev_groups = ["test", "dev", "docs"]

[tool.deptry.package_module_name_map]
pre-commit = "pre_commit"
